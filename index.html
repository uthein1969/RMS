<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AML RMS - Sign In</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      background: #1e293b; padding: 32px 28px; border-radius: 12px; width: 100%; max-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4); border: 1px solid #334155;
    }
    h2 { color: #f8fafc; margin: 0 0 20px; text-align: center; font-size: 20px; }
    label { color: #94a3b8; font-size: 13px; display: block; margin-bottom: 6px; }
    input {
      width: 100%; padding: 10px 12px; margin-bottom: 16px; border-radius: 6px;
      border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; outline: none;
    }
    button {
      width: 100%; padding: 10px; background: #2563eb; color: #fff; border: none;
      border-radius: 6px; font-weight: 600; cursor: pointer;
    }
    .err { color: #ef4444; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
  </style>
</head>
<body>
  <div class="box">
    <h2>AML RMS Dashboard</h2>
    <form onsubmit="checkAuth(event)">
      <label>Username</label>
      <input type="text" id="u" required />
      <label>Password</label>
      <input type="password" id="p" required />
      <button type="submit">Sign In</button>
      <div id="err" class="err">Username သို့မဟုတ် Password မှားယွင်းနေပါသည်</div>
    </form>
  </div>
  <script>
    function checkAuth(e) {
      e.preventDefault();
      const u = document.getElementById('u').value.trim();
      const p = document.getElementById('p').value.trim();

      // စိတ်ကြိုက် Username နှင့် Password
      if (u === "admin" && p === "Risk@2026") {
        window.location.href = './Dashboard.html';
      } else {
        document.getElementById('err').style.display = 'block';
      }
    }
  </script>
</body>
</html>
