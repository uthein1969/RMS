<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RMS - Login</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .login-card {
      background-color: #1e293b;
      padding: 32px 28px;
      border-radius: 12px;
      width: 100%;
      max-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      border: 1px solid #334155;
    }
    h2 {
      color: #f8fafc;
      margin: 0 0 20px 0;
      text-align: center;
      font-size: 20px;
    }
    label {
      color: #94a3b8;
      font-size: 13px;
      display: block;
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      margin-bottom: 16px;
      border-radius: 6px;
      border: 1px solid #475569;
      background: #0f172a;
      color: #fff;
      font-size: 14px;
      box-sizing: border-box;
      outline: none;
    }
    input:focus {
      border-color: #3b82f6;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    .error {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-top: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>AML RMS Dashboard</h2>
    <form onsubmit="handleLogin(event)">
      <label for="username">Username</label>
      <input type="text" id="username" required autocomplete="username" />

      <label for="password">Password</label>
      <input type="password" id="password" required autocomplete="current-password" />

      <button type="submit">Sign In</button>
      <div id="error-msg" class="error">Username သို့မဟုတ် Password မှားယွင်းနေပါသည်</div>
    </form>
  </div>

  <script>
    // သတ်မှတ်ထားသော Username နှင့် Password (မိမိ စိတ်ကြိုက် ပြင်နိုင်ပါသည်)
    const TARGET_USER = "admin";
    const TARGET_PASS = "Risk@2026";

    function handleLogin(e) {
      e.preventDefault();
      
      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();

      // တိုက်ရိုက် စစ်ဆေးခြင်း
      if (user === TARGET_USER && pass === TARGET_PASS) {
        sessionStorage.setItem('rms_authenticated', 'true');
        window.location.href = './index.html';
      } else {
        document.getElementById('error-msg').style.display = 'block';
      }
    }

    // Login ဝင်ထားပြီးသားဖြစ်ပါက Dashboard သို့ တိုက်ရိုက်သွားမည်
    if (sessionStorage.getItem('rms_authenticated') === 'true') {
      window.location.href = './index.html';
    }
  </script>
</body>
</html>
